# Alembic configuration for TaskFlow Pro.
#
# The database URL and its secret are NOT stored here. `migrations/env.py`
# reads `DATABASE_URL` from the application settings (`.env`) at runtime.

[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is injected by env.py from app settings; left empty on purpose.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
