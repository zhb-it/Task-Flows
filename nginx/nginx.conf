# TaskFlow Pro — Nginx 反向代理配置（TASK-060；开发文档 §31）
#
# 生产链路（§31）：
#
#     Client → Nginx → Gunicorn → Uvicorn Worker → FastAPI
#
# 本文件以**只读**方式挂载进容器：`./nginx/nginx.conf:/etc/nginx/nginx.conf:ro`
# （见 docker-compose.prod.yml）。它是 §4 文件清单要求的那份 nginx 配置。
#
# §31 要求 Nginx 负责五件事，对应位置如下：
#   1. 反向代理      → upstream app_backend + location /
#   2. 请求体大小限制 → client_max_body_size（粗粒度外圈，业务上限仍在应用侧）
#   3. 基础超时配置   → client_*_timeout / proxy_*_timeout
#   4. 静态附件访问   → **刻意不实现**，理由见下方「关于静态附件访问」
#   5. 基础安全 Header → add_header（nosniff / X-Frame-Options / Referrer-Policy）
#
# ---------------------------------------------------------------------------
# 关于静态附件访问（§31 第 4 项）：本项目**不用 Nginx 直出附件**
# ---------------------------------------------------------------------------
# 附件是**私有资源**：TASK-043 为下载实现了功能级权限 `attachment:download`
# + 资源级归属链校验（不在链上返回 404，防枚举），TASK-042 的下载端点还负责
# `Content-Disposition` / `nosniff` / 类型回落等响应头处理。
#
# 若让 Nginx 用 `alias`/`root` 直接映射 attachment_storage 卷，鉴权会被**完全
# 绕过**：任何知道（或猜到）文件路径的人都能下载任意附件——一个教科书式的
# IDOR。把私有附件变成公开静态资源，是「用性能换掉安全性」的典型反模式。
#
# 因此本 TASK 的选择是：**附件继续由 API 鉴权后返回**（链路仍是
# Client → Nginx → API → 文件流），Nginx 只做反代。§31 的「静态附件访问」在
# 本项目里被有意处理成「不做直出」，理由记录于 DECISIONS 040。
#
# 若要进一步优化大附件吞吐，正确的下一步不是放开直出，而是让应用在鉴权通过后
# 返回 `X-Accel-Redirect` 指向 internal location，由 Nginx 读卷出文件——鉴权
# 仍在应用层。这属于**新增功能**（需改动 TASK-042/043 的下载端点），须先有
# 文档依据再实施（项目规则 §3/§5）。

user  nginx;
worker_processes  auto;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 不暴露 Nginx 版本号：错误页与 Server 头里的版本信息对攻击者有价值
    # （§9 安全清单「不泄露内部细节」）。
    server_tokens  off;

    # --- 日志 -----------------------------------------------------------------
    # 与应用的容器日志一致输出到 stdout/stderr，交给 Docker 的 json-file 驱动
    # 接管——compose 里已配 max-size/max-file 轮转，不轮转的日志会写满宿主磁盘。
    #
    # `rid=$http_x_request_id` 让两层的日志能用**同一个 id** 串起来（§34）：
    # 客户端报障时给出一个 request_id，即可同时捞出 Nginx 与应用两侧的记录。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time '
                      'rid=$http_x_request_id';
    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # --- §31 请求体大小限制（粗粒度外圈）--------------------------------------
    # 真正的业务上限由应用侧的 MAX_UPLOAD_SIZE（默认 10 MiB）判定，并返回 §26
    # 的统一 JSON 错误信封。这里刻意留出余量（12m > 10 MiB），原因有二：
    #   ① 若 Nginx 比应用更严格，超限上传会拿到 Nginx 的 HTML 错误页而不是
    #      API 的一致 JSON 信封，客户端无法统一处理；
    #   ② MAX_UPLOAD_SIZE 调大时不必同步改本文件，避免两处配置漂移。
    # 它拦住的是「巨大的请求体直接灌进来」这类根本不需要走业务的流量。
    client_max_body_size  12m;

    # --- §31 基础超时配置 ------------------------------------------------------
    client_body_timeout    15s;   # 慢速上传（slowloris 型攻击）
    client_header_timeout  15s;   # 慢速发请求头
    send_timeout           15s;

    # --- 上游 -----------------------------------------------------------------
    # keepalive 复用与后端的连接，避免每个请求重新握手（Gunicorn 侧是长驻
    # worker 进程，复用收益明显）。
    upstream app_backend {
        server app:8000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        # --- §31 基础安全 Header -------------------------------------------------
        # 用 `always` 让 4xx/5xx 响应也带上（Nginx 默认只给 2xx/3xx 添加）。
        # X-Frame-Options / Referrer-Policy 主要面向将来可能由同域提供的
        # 前端页面；X-Content-Type-Options 与 TASK-042 在下载端点里加的那条是
        # 同一目的（阻止浏览器嗅探内容类型）。
        add_header X-Content-Type-Options  nosniff      always;
        add_header X-Frame-Options         DENY         always;
        add_header Referrer-Policy         no-referrer  always;
        # 未配置 TLS（TASK-060 决策：证书不进仓库，TLS 由上游负载均衡终止），
        # 因此**不发** Strict-Transport-Security——在纯 HTTP 上发 HSTS 既无效
        # 也会误导（浏览器只对 HTTPS 响应生效）。

        # 代理自身存活探针：只回答「Nginx 能提供 HTTP」，不依赖上游。
        # 若这里改成探 /health，则应用重启期间 Nginx 也会被标记为不健康，
        # 让「入口挂了」和「后端重启中」两件事混在一起，反而更难排查。
        # Content-Type 由 default_type（application/octet-stream）决定，这里用
        # `types` 覆盖成 text/plain——注意不能用 `add_header Content-Type`：
        # add_header 是**追加**而非替换，会产出重复的 Content-Type 头。
        location = /nginx-health {
            access_log  off;
            types        { }
            default_type text/plain;
            return       200  "ok\n";
        }

        location / {
            proxy_pass  http://app_backend;
            proxy_http_version  1.1;
            # 配合 upstream keepalive：Connection 必须置空，否则会退化为短连接。
            proxy_set_header  Connection  "";

            # --- 真实客户端 IP 的信任边界（DECISIONS 018 遗留约束，TASK-060 解决）---
            # 用 `$remote_addr` **覆盖**写入，而不是 `$proxy_add_x_forwarded_for`
            # ——后者会把客户端传来的值原样拼在前面，等于把「真实 IP」交给客户端
            # 自己决定。覆盖之后，客户端即使塞了 `X-Forwarded-For: 1.2.3.4`，
            # 到达应用时也已被替换成真实 TCP 对端地址（Nginx 的 $remote_addr）。
            #
            # 应用侧的第二步校验：只在 TRUST_PROXY_HEADERS=true 且对端落在
            # TRUSTED_PROXY_IPS 网段内时才采信该头（app/core/client_ip.py）。
            # 两层配合，才让「IP 维度限流」在反代之后依然有效。
            proxy_set_header  X-Forwarded-For    $remote_addr;
            proxy_set_header  X-Forwarded-Proto  $scheme;
            proxy_set_header  X-Forwarded-Host   $host;
            # 用 `$host`（规范化后的 Host，取不到时回落 server_name）而不是
            # `$http_host`：后者会把客户端任意 Host 头透传给应用。
            proxy_set_header  Host               $host;

            # 透传客户端 request_id（§34）。显式重设而不是「依赖 Nginx 默认转发
            # 客户端头」，是因为 $http_x_request_id 会把重复的同名头合并成
            # 「a, b」——应用侧的白名单校验会拒绝这种值并重新生成，从而避免
            # 客户端用重复头把自己的请求伪装成别人的 id。
            # 客户端没带则值为空，应用会自行生成（§34「可由客户端传入或服务端生成」）。
            proxy_set_header  X-Request-ID       $http_x_request_id;

            # 后端超时：connect 要短（连不上就快速失败，别让客户端干等），
            # read/send 给足应用处理时间（60s 也是 Gunicorn --timeout 的量级）。
            proxy_connect_timeout  5s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;
        }
    }
}
