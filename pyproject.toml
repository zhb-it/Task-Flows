[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
# 挂起护栏：任何单个用例超过 180s 就 dump 全线程栈并终止本次运行。
#
# 没有这道护栏时，一个卡住的用例会把整个运行拖成「永远不结束」——本地表现为
# 无人值守地跑几小时，CI 上表现为耗到 job 的 6 小时上限才被杀，且**拿不到任何
# 定位信息**（pytest 默认不打印在跑什么，输出停在最后一个完成的点）。
# 180s 的依据：全量基线约 550s / 1230 个用例，最慢的用例（Celery eager 与
# 迁移可逆性）在秒级，180s 是「绝不可能是正常耗时」的量级，不会误杀。
# 触发时 stderr 会打印卡住位置的完整栈，直接指向根因。
faulthandler_timeout = 180

[tool.ruff]
# 目标版本与 Dockerfile（python:3.13-slim）保持一致，避免规则按旧语法给建议。
target-version = "py313"

[tool.ruff.lint]
# 规则集**显式钉死**，不依赖 ruff 的默认值。
#
# 实测：同一份代码在 ruff 0.16.7 下，不写 select 时报 219 项（默认集已远宽于
# 经典默认），写成本集则报 36 项。若依赖默认值，「CI 是否通过」就取决于 CI 当天
# 装到的 ruff 版本，同一份提交会时红时绿——故必须显式写死。
#
# 选这四条的理由（见 DECISIONS 043）：它们抓的是**缺陷**而非风格——
#   E4 导入相关（重复导入等）、E7 语句级错误、E9 运行时错误（如语法级问题）、
#   F Pyflakes（未用导入/变量、重定义、未定义名）。
# 不引入 I（import 排序）/ UP（语法现代化）/ B（bugbear）/ S（bandit）等：
# 那些会让本 TASK 顺带重排、改写大量既有代码，与项目规则 §5「不进行无关重构」冲突。
select = ["E4", "E7", "E9", "F"]


[tool.coverage.run]
# 只度量产品代码：tests/ 不计入（给测试本身算覆盖率没有意义，只会稀释信号）。
# `--cov` 不带参数时即以此为 source，故本地命令可以简化成 `pytest --cov --cov-report=term-missing`。
source = ["app"]
# 分支覆盖：比行覆盖更能暴露「只测了 if 的一边」「except 分支从未走到」这类
# 真实缺口（本项目 66 处未覆盖行里，多数正是这类分支）。仅本地测量，**不设阈值**——
# TASK-062 的决策是「不做 CI 覆盖率门禁」（见 docs/QUALITY.md）。
branch = true

[tool.coverage.report]
# 终端逐行列出未覆盖行号，便于按需补测而不必生成 HTML。
show_missing = true
# 刻意排除、不计入分母的代码（理由见 docs/QUALITY.md「刻意排除的代码」一节）：
#   - `def __repr__`：调试辅助，无业务语义——为凑行数给它写测试属于「为数字而测」
#     （Phase 14 明确禁止）。**这是一条有实际影响的排除**：16 个模型里共 32 条
#     语句因此不计入分母；若计入，整体行覆盖率是 98.63% 而不是 99.96%。
# coverage 的语义是：匹配行若**开启一个代码块**，则整块都被排除。
# 注：这里**只列真实存在**的排除项。`if TYPE_CHECKING:` / `raise NotImplementedError`
# 在本仓库中均不存在（实测 0 处），故不预先豁免——将来真加了再显式加进来，
# 避免一条空转的排除规则悄悄藏住新代码。
exclude_also = [
    "def __repr__",
]

