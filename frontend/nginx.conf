# TaskFlow Pro — 前端 SPA 服务器配置（TASK-079；前端规格 §56 / §59 阶段 15）
#
# 本文件被 COPY 进 frontend 镜像（frontend/Dockerfile 阶段 2），只负责**静态托管**：
#
#     Client → 入口 Nginx(compose 的 nginx 服务)
#                ├── /api/  → app:8000（API 反代，配置在 nginx/nginx.conf）
#                └── /      → frontend:80（本文件）
#                                └── /usr/share/nginx/html 下的 dist 产物
#
# 为什么本层不做 /api 反代：路由是**安全边界**（X-Forwarded-For 覆盖写入、
# 真实 IP 信任网段、request_id 串联都在入口 Nginx 的 /api/ location 里），
# 分散到两层 nginx 会让「同一份安全语义」出现两份拷贝。入口统一分流，
# 本层只做一个纯静态服务器，职责单一、可独立测试（tests/test_nginx_config.py
# 对两个文件各有专项断言）。

user  nginx;
worker_processes  auto;

error_log  /dev/stderr  warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 与入口 Nginx 同理：不暴露版本号。
    server_tokens  off;

    # --- 日志 -----------------------------------------------------------------
    # 与入口 Nginx 一致输出到 stdout/stderr，交给 Docker json-file 轮转
    # （compose 已配 max-size/max-file）。rid 透传入口带来的 X-Request-ID，
    # 三层（入口 Nginx / 本层 / 应用）的日志可用同一个 id 串起来。
    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent rt=$request_time '
                      'rid=$http_x_request_id';
    access_log  /dev/stdout  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # --- gzip（vite 产物是文本为主的 JS/CSS，压缩收益显著）---------------------
    gzip            on;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  _;

        # 静态根目录。必须写在 **server 级**：/assets/ location 不写 root 时会
        # 落到 nginx 的编译默认值（prefix 相对的 /etc/nginx/html，官方镜像并不
        # 在那里放文件 → 全部 404）——这正是本 TASK 冒烟实测踩到并修掉的坑。
        root  /usr/share/nginx/html;
        index index.html;

        # --- 安全 Header（与入口 Nginx 同一套）-----------------------------------
        # ⚠ nginx 的 add_header 继承规则：location 里一旦出现自己的 add_header，
        # server 级的**全部**失效。因此带缓存头的 /assets/ location 里必须把这三条
        # 原样重复一遍——不是冗余，是语言规则（漏掉 = 静态资源响应裸奔）。
        add_header X-Content-Type-Options  nosniff      always;
        add_header X-Frame-Options         DENY         always;
        add_header Referrer-Policy         no-referrer  always;

        # 自有存活探针：不依赖任何文件，与入口 Nginx 的 /nginx-health 同思路。
        location = /nginx-health {
            access_log  off;
            types        { }
            default_type text/plain;
            return       200  "ok\n";
        }

        # --- 带 content hash 的构建产物：永久缓存 --------------------------------
        # vite 输出的 assets/<name>-<hash>.js/css 文件名即指纹，内容变则名变，
        # 因此可以放心让浏览器/中间层缓存一年（immutable 免去条件请求）。
        # 用单条 add_header 显式写 max-age，而不是 `expires 1y`——后者会自己追加
        # 一条 Cache-Control，与本条叠加成重复头（冒烟实测发现后合并）。
        location /assets/ {
            add_header  Cache-Control              "public, max-age=31536000, immutable";
            # 继承规则（见上）：重新声明 server 级的三条安全头。
            add_header  X-Content-Type-Options     nosniff      always;
            add_header  X-Frame-Options            DENY         always;
            add_header  Referrer-Policy            no-referrer  always;
        }

        # --- SPA 入口：history 模式回退 ------------------------------------------
        # 路由用 createWebHistory（router/index.ts），/teams/1 这类深链在磁盘上
        # 并不存在对应文件，必须回退到 index.html 交给前端路由接管。
        # 命中此 location 的都是「无 hash 指纹」的文件（index.html、favicon 等），
        # 标记 no-cache：发版后用户立刻拿到新壳，避免旧 index.html 引用已被
        # 删除的旧 hash 资源（白屏的经典成因）。
        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header  Cache-Control              "no-cache";
            # 继承规则（见上）：重新声明 server 级的三条安全头。
            add_header  X-Content-Type-Options     nosniff      always;
            add_header  X-Frame-Options            DENY         always;
            add_header  Referrer-Policy            no-referrer  always;
        }
    }
}
