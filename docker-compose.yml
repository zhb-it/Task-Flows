# TaskFlow Pro — full stack
# TASK-004: PostgreSQL. TASK-005: Redis. TASK-009: app service (brings the
# API up inside Docker, depends on healthy postgres/redis).
# Env values fall back to the dev defaults in `.env.example` when not present in `.env`.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskflow-app:latest
    container_name: taskflow-app
    # Inside the compose network the DB/Redis are reached by service name,
    # not localhost (which would mean the app container itself).
    environment:
      APP_ENV: ${APP_ENV:-development}
      # TASK-095：运行时以非超管角色连接——受 RLS 约束（迁移 b8d4f2a6c9e1
      # 创建角色并授权；迁移/测试继续走 POSTGRES_USER 超管）。密码轮换见
      # DEPLOYMENT.md「数据库运行时角色」。
      DATABASE_URL: postgresql+asyncpg://taskflow_app:${TASKFLOW_APP_DB_PASSWORD:-taskflow_app}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # Attachment storage (TASK-042 / §17, §51). The named volume below keeps
      # uploaded files across container rebuilds; without it every `up --build`
      # would silently orphan the DB rows pointing at them.
      UPLOAD_DIR: /app/storage
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      # 维护任务调度（TASK-089）：间隔经 .env 可配，缺省错峰
      # （归档每日 19:30 UTC ≈ 北京 03:30；清理每小时第 45 分）。
      ARCHIVE_SCHEDULE_HOUR: ${ARCHIVE_SCHEDULE_HOUR:-19}
      ARCHIVE_SCHEDULE_MINUTE: ${ARCHIVE_SCHEDULE_MINUTE:-30}
      CLEANUP_SCHEDULE_MINUTE: ${CLEANUP_SCHEDULE_MINUTE:-45}
      ARCHIVE_FINAL_RETENTION_DAYS: ${ARCHIVE_FINAL_RETENTION_DAYS:-365}
    volumes:
      - attachment_storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 探 /health/ready（TASK-088）：依赖不可用时 503 → 容器标记 unhealthy。
      # 依赖抖动期间实例应被摘除而不是继续接流量，readiness 才是这个决策的正确依据。
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # TASK-048（§29）：dev compose 至少包含 celery_worker。
  # 与 app 同镜像，仅覆盖启动命令；Broker/Backend 均回落到 REDIS_URL（§21）。
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskflow-app:latest
    container_name: taskflow-celery-worker
    command:
      ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      # TASK-095：运行时以非超管角色连接——受 RLS 约束（迁移 b8d4f2a6c9e1
      # 创建角色并授权；迁移/测试继续走 POSTGRES_USER 超管）。密码轮换见
      # DEPLOYMENT.md「数据库运行时角色」。
      DATABASE_URL: postgresql+asyncpg://taskflow_app:${TASKFLOW_APP_DB_PASSWORD:-taskflow_app}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      # 通知/清理类任务（TASK-049/050）同样需要读库与附件目录。
      UPLOAD_DIR: /app/storage
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      ARCHIVE_SCHEDULE_HOUR: ${ARCHIVE_SCHEDULE_HOUR:-19}
      ARCHIVE_SCHEDULE_MINUTE: ${ARCHIVE_SCHEDULE_MINUTE:-30}
      CLEANUP_SCHEDULE_MINUTE: ${CLEANUP_SCHEDULE_MINUTE:-45}
      ARCHIVE_FINAL_RETENTION_DAYS: ${ARCHIVE_FINAL_RETENTION_DAYS:-365}
    volumes:
      - attachment_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # inspect ping：向所有 worker 节点发控制消息，无节点应答时非零退出。
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping", "--timeout", "10"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # TASK-089（§61）：Celery Beat —— 维护任务（日志归档 / 附件清理）的周期调度器。
  # ⚠ **beat 必须单实例**：多个 beat 会按各自时刻表重复投递同一条任务。
  #   任务本身幂等（TASK-051），重复执行不会产生重复副作用，但会浪费队列与
  #   worker 资源——幂等只保证「不错」，不保证「不浪费」。因此本服务刻意
  #   不声明 replicas / 不可扩展，扩容只发生在 celery_worker 上。
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: taskflow-app:latest
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=info"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      # TASK-095：运行时以非超管角色连接——受 RLS 约束（迁移 b8d4f2a6c9e1
      # 创建角色并授权；迁移/测试继续走 POSTGRES_USER 超管）。密码轮换见
      # DEPLOYMENT.md「数据库运行时角色」。
      DATABASE_URL: postgresql+asyncpg://taskflow_app:${TASKFLOW_APP_DB_PASSWORD:-taskflow_app}@postgres:5432/${POSTGRES_DB:-taskflow}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      ARCHIVE_SCHEDULE_HOUR: ${ARCHIVE_SCHEDULE_HOUR:-19}
      ARCHIVE_SCHEDULE_MINUTE: ${ARCHIVE_SCHEDULE_MINUTE:-30}
      CLEANUP_SCHEDULE_MINUTE: ${CLEANUP_SCHEDULE_MINUTE:-45}
      ARCHIVE_FINAL_RETENTION_DAYS: ${ARCHIVE_FINAL_RETENTION_DAYS:-365}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: taskflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taskflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: taskflow-redis
    ports:
      - "6389:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  attachment_storage:
